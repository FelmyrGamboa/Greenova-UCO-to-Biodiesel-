# Greenova in Docker: MySQL + backend (FastAPI) + website (Vite dev server).
#
# From this folder (dockerfiles):
#     docker compose up --build         start everything (add -d to run in the background)
#     docker compose down               stop it (the MySQL data is kept)
#     docker compose down -v            stop it and delete the MySQL data
#
# Website: http://localhost:8443   API: http://localhost:8000/docs   MySQL: 127.0.0.1:3307
# See DOCKER_GUIDE.md for how the backend connects to the database and for troubleshooting.

name: greenova

services:
  # ---------- MySQL 8.4: the greenova_db database, user "greenova" with no password ----------
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: greenova_db
      # Only for logging in as root (e.g. in HeidiSQL). The backend uses "greenova".
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-greenova_root}
      TZ: ${TZ:-Asia/Manila}
      # MYSQL_USER is not set on purpose: the image refuses to create a user without a password,
      # so mysql-init/01-greenova-user.sql creates 'greenova' (no password) instead.
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      # 3307 on the laptop, because the Windows MySQL80 service already uses 3306.
      # 127.0.0.1 only: a user without a password should not be reachable from the Wi-Fi.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    healthcheck:
      # Over TCP (not the socket), and as greenova: it only passes once the first-start setup has
      # finished and the greenova user exists.
      test: ["CMD", "mysql", "-h", "127.0.0.1", "-u", "greenova", "-e", "SELECT 1", "greenova_db"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------- Backend: FastAPI on port 8000, driving the real machine ----------
  # It needs the Pi's GPIO chip (centrifuge, load cell) and the ESP32's USB port. Check the names
  # first with:  ls /dev/gpiochip* /dev/ttyUSB* /dev/ttyACM*   and list only devices that exist.
  backend:
    build:
      context: ../backend
      dockerfile: ../dockerfiles/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # The MySQL login (app/config.py reads these; they win over anything in backend/.env).
      DB_HOST: mysql                     # the service name above, not localhost
      DB_PORT: "3306"                    # the port inside Docker's network, not 3307
      DB_USER: greenova
      DB_PASSWORD: ""                    # no password
      DB_NAME: greenova_db
      GPIO_CHIP: "0"                     # Pi 4 / Pi 5 on a recent OS; "4" if you only have /dev/gpiochip4
      TZ: ${TZ:-Asia/Manila}
    devices:
      - /dev/gpiochip0:/dev/gpiochip0    # change both to gpiochip4 if that's the only one you have
      - /dev/ttyUSB0:/dev/ttyUSB0        # the ESP32 (change both to /dev/ttyACM0 if that's its name)
    volumes:
      - ../backend/hardware.toml:/app/hardware.toml
      - ../backend/loadcell_calibration.json:/app/loadcell_calibration.json
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ---------- Website: Vite dev server (npm run dev) on port 8443 ----------
  frontend:
    build:
      context: ../frontend
      dockerfile: ../dockerfiles/frontend.Dockerfile
    # command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8443"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # vite.config.ts forwards /api to this address (the backend service, inside Docker).
      GREENOVA_API: http://backend:8000
      PORT: "8443"
    ports:
      - "${FRONTEND_PORT:-8443}:8443"

volumes:
  mysql-data: